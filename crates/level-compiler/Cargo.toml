[package]
name = "postretro-level-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Level compiler for Postretro"
license.workspace = true

[[bin]]
name = "prl-build"
path = "src/main.rs"

[dependencies]
postretro-level-format = { workspace = true, features = ["serde", "gltf-resolve"] }
shambler.workspace = true
glam.workspace = true
anyhow.workspace = true
log.workspace = true
env_filter = "2"
thiserror.workspace = true
rayon.workspace = true
bvh = { version = "0.12", default-features = false, features = ["std"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
png.workspace = true
image.workspace = true
blake3 = "1"
bytemuck = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
crossterm = "0.29"
tempfile.workspace = true
same-file.workspace = true
fs4.workspace = true
# The CellResidencySet bake (id 51) samples visibility with the runtime portal
# walk over the world the runtime loader builds, so the baked set is what the
# runtime sees.
postretro-level-loader.workspace = true
postretro-visibility.workspace = true

[dev-dependencies]
postretro-test-log-capture.workspace = true
postretro-render-cpu.workspace = true
proptest = { workspace = true }
