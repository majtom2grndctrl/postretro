[package]
name = "postretro-netcode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authoritative gameplay replication for Postretro"
license.workspace = true

[features]
# Cross-crate simulation test seams. Runtime consumers never enable this.
test-support = []
dev-tools = ["postretro-net/dev-tools"]

[dependencies]
blake3.workspace = true
getrandom.workspace = true
glam.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

postretro-combat-model.workspace = true
postretro-entities.workspace = true
postretro-foundation.workspace = true
postretro-model.workspace = true
postretro-net.workspace = true
postretro-physics.workspace = true
postretro-scripting-core.workspace = true
postretro-sim.workspace = true

[dev-dependencies]
parry3d.workspace = true
postretro-combat-model = { workspace = true, features = ["test-support"] }
postretro-entities = { workspace = true, features = ["script-ffi", "test-support"] }
postretro-net = { workspace = true, features = ["dev-tools"] }
postretro-sim = { workspace = true, features = ["test-support"] }
postretro-test-log-capture.workspace = true
