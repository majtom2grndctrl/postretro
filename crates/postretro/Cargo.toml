[package]
name = "postretro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A retro-style FPS engine inspired by Doom/Quake"
license.workspace = true
default-run = "postretro"

[dependencies]
# Windowing
winit.workspace = true

# Math
glam.workspace = true
bytemuck.workspace = true

# Collision (parry3d trimesh + ray queries). nalgebra types are confined to
# the `collision` module per the entity_model.md §7 invariant.
parry3d = { workspace = true }

# Audio
kira.workspace = true

# Gamepad input
gilrs.workspace = true

# Image loading
image.workspace = true

# Content hashing for stable data signatures.
blake3.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization (scripting FFI transit)
serde.workspace = true
serde_json.workspace = true

# Player options persistence (`options` module): `settings.toml` wire format and
# platform config-dir resolution. No wgpu/renderer coupling.
toml.workspace = true
directories.workspace = true

# Device-local player identity generation at session build. Kept out of net so
# the transport remains a dependency-minimal, registry-blind courier.
getrandom = "0.3"

# Scripting runtimes (embedded)
rquickjs.workspace = true
mlua.workspace = true

# Filesystem watcher — dev-mode hot reload (sub-plan 7). The runtime activation
# of the watcher is gated on `cfg(debug_assertions)`; compiling the deps in
# release builds is cheap and lets the scripting module share one dependency
# set across profiles.
notify.workspace = true
notify-debouncer-full.workspace = true

# Logging
log.workspace = true
env_logger.workspace = true

# Workspace members
postretro-level-format = { workspace = true, features = ["gltf-resolve"] }
postretro-level-loader = { workspace = true }
postretro-model = { workspace = true }
postretro-render-data = { workspace = true }
postretro-render-cpu = { workspace = true }
postretro-renderer = { workspace = true }
postretro-lighting = { workspace = true, features = ["script-ffi"] }
postretro-visibility = { workspace = true }
postretro-foundation = { workspace = true }
postretro-entities = { workspace = true, features = ["script-ffi"] }
postretro-scripting-core = { workspace = true }
postretro-ui = { workspace = true }
postretro-net = { workspace = true }

# Debug UI (egui) — only compiled in when the `dev-tools` feature is enabled.
# Pinned to 0.34 for the binary's `egui-winit` integration with winit 0.30.
# Renderer-side egui/wgpu compatibility belongs to `postretro-renderer`.
egui = { version = "0.34", optional = true }
egui-winit = { version = "0.34", optional = true }

[features]
# Pulls in the egui-based debug panel and its diagnostic chord. Without this
# feature, none of the egui crates are linked.
dev-tools = [
    "dep:egui",
    "dep:egui-winit",
    "postretro-level-loader/dev-tools",
    "postretro-net/dev-tools",
    "postretro-renderer/dev-tools",
]
# Headless batch mode for AI-agent and content-CI use. Gates modules only —
# no optional deps, no egui, independent of dev-tools.
# See: context/plans/done/agentic-observability
observability = []
# Static offscreen frame capture for content CI. Gates binary-only modules and
# adds no dependencies or UI surface.
capture = []

[build-dependencies]
postretro-script-compiler = { path = "../script-compiler" }

[dev-dependencies]
postretro-test-log-capture.workspace = true
postretro-entities = { workspace = true, features = ["script-ffi", "test-support"] }
postretro-ui = { workspace = true, features = ["test-fixtures"] }
# Exercise shipped TypeScript data scripts through the same SWC bundler used by
# `scripts-build`, without spawning the sidecar process during unit tests.
postretro-script-compiler = { path = "../script-compiler" }

# Enable the net crate's dev-only in-memory packet conditioner (`postretro_net::harness`:
# `PacketConditioner`/`LinkConfig`) for the Phase 3 prediction/reconciliation latency
# harness (M15 Phase 3 Task 6). The harness module is gated `#[cfg(any(test, feature =
# "dev-tools"))]`; the default runtime build of `postretro` does NOT pull it in, since
# this only activates under test/example/bench builds.
postretro-net = { workspace = true, features = ["dev-tools"] }

# No kira dev-dependency is needed to reach its mock backend: kira 0.12 compiles
# `kira::backend::mock` unconditionally (it is NOT behind a feature flag), so
# `MockBackend` is always available to tests regardless of the trimmed feature
# set declared in the workspace manifest. All `kira::backend::mock` references in
# the audio module are confined to `#[cfg(test)]`, so the non-test crate never
# names mock even though it ships in the kira dependency.

# Property-based testing for binary simulation determinism invariants.
proptest = { workspace = true }

# Injected temp dirs for the `options` persistence tests — keeps load/save tests
# off the real user config dir. Not used by the atomic-save path (that hand-rolls
# its own sibling temp file).
tempfile = "3"

# Any explicit `[[bin]]` entry disables Cargo's implicit `src/main.rs`
# detection, so the engine binary must also be declared explicitly.
[[bin]]
name = "postretro"
path = "src/main.rs"

[[bin]]
name = "gen-script-types"
path = "src/bin/gen_script_types.rs"

[[test]]
name = "capture_frame"
path = "tests/capture_frame.rs"
required-features = ["capture"]
