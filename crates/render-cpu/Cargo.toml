[features]
default = []
dev-tools = []

[dependencies]
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
log.workspace = true
postretro-entities.workspace = true
postretro-level-format = { workspace = true, features = ["gltf-resolve"] }
postretro-level-loader.workspace = true
postretro-model.workspace = true
postretro-render-data.workspace = true
postretro-visibility.workspace = true

[dev-dependencies]
postretro-lighting.workspace = true
