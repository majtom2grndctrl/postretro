[package]
name = "postretro-level-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared level format types for Postretro"
license.workspace = true

[features]
serde = ["dep:serde"]
gltf-resolve = ["dep:gltf", "dep:percent-encoding"]
# Exposes `sh_body::pre_flag`, which converts a PRL between the SH sections'
# pre-flag format and the current one, for tests that compare against a
# baseline compiler from before the body-presence field. Never enabled by
# production dependencies.
test-support = []

[dependencies]
serde = { workspace = true, optional = true }
gltf = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
glam.workspace = true
thiserror.workspace = true
bitflags.workspace = true
blake3.workspace = true
log.workspace = true

[dev-dependencies]
postretro-test-log-capture.workspace = true
serde_json.workspace = true
proptest.workspace = true
# Microbenchmarks for hot-path helpers (e.g. fog cell-mask OR loop). Pulled in
# only as a dev-dependency so release binaries don't carry the harness.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "fog_cull_bench"
harness = false
